[project]
name = "agent-config-baseline"
version = "0.1.0"
description = "Vendor-neutral security baseline checker for AI agent configuration files"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "PyYAML==6.0.2",
    "jsonschema==4.26.0",
]

[project.scripts]
acb = "acb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acb"]

[tool.hatch.build.targets.wheel.force-include]
"controls" = "acb/_data/controls"
"schema" = "acb/_data/schema"
"clients" = "acb/_data/clients"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
    "ty==0.0.90",
]

[tool.ty.src]
# The verifier imports sigstore, which only its own environment (verifier/pyproject.toml) installs.
exclude = ["verifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Formatter conflicts, as listed in ruff's formatter documentation.
    "COM812",
    "ISC001",
    # Mutually exclusive docstring layouts; D211 and D212 are kept.
    "D203",
    "D213",
    # Licensing is declared by LICENSE and LICENSE-CONTENT, not per-file headers.
    "CPY001",
]

[tool.ruff.lint.per-file-ignores]
# Writing to the terminal is what a command-line entry point is for.
"src/acb/cli.py" = ["T201"]
"scripts/*.py" = ["T201"]
# The verifier is a standalone program in its own project, and its JSON on stdout is its interface.
"verifier/*.py" = ["T201", "INP001"]
# pytest reports failures through assert, and test names document the test.
"tests/**" = ["S101", "D100", "D101", "D102", "D103", "D104", "PLR2004"]

[tool.ruff.format]
docstring-code-format = true
