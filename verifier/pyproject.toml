[project]
name = "acb-sigstore-verify"
version = "0.1.0"
description = "External Sigstore bundle verifier for acb's ACB-PROV-003, run from its own environment"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "sigstore==4.5.1",
]

[project.scripts]
acb-sigstore-verify = "acb_sigstore_verify:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["acb_sigstore_verify.py"]
