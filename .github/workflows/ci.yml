name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Validate, test and self-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.12"
          enable-cache: true

      - name: Install project
        run: uv sync --locked

      - name: Validate control schema
        run: |
          uv run python -c "
          from acb.loader import load_controls, default_controls_dir, default_schema_path
          controls = load_controls(default_controls_dir(), default_schema_path())
          print(f'{len(controls)} control(s) validated against schema/control.schema.json')
          "

      - name: Check generated docs are up to date
        run: uv run python scripts/gen_docs.py --check

      - name: Check formatting with ruff
        run: uv run ruff format --check .

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Type check with ty
        run: uv run ty check

      # Outside the tree, so the self-check does not scan its packages.
      - name: Install the Sigstore verifier
        run: UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/verifier-venv" uv sync --locked --project verifier

      - name: Run test suite
        env:
          ACB_SIGSTORE_VERIFIER: ${{ runner.temp }}/verifier-venv/bin/acb-sigstore-verify
        run: uv run pytest -q

      - name: Checkout operator configuration from the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
          path: operator-config
          sparse-checkout: |
            .acb.yaml
            .acb-exceptions.yaml
          sparse-checkout-cone-mode: false

      - name: Move operator configuration out of the scanned tree
        run: mv operator-config "$RUNNER_TEMP/operator-config"

      - name: Self-check (acb check .)
        run: |
          operator="$RUNNER_TEMP/operator-config"
          : > "$RUNNER_TEMP/empty.yaml"
          config="$operator/.acb.yaml"
          exceptions="$operator/.acb-exceptions.yaml"
          [ -f "$config" ] || config="$RUNNER_TEMP/empty.yaml"
          [ -f "$exceptions" ] || exceptions="$RUNNER_TEMP/empty.yaml"
          uv run acb check . --format text --require-artifacts --config "$config" --exceptions "$exceptions"
