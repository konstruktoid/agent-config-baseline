schema_version: "1.0"
id: ACB-CFG-004
title: Human approval requirements are defined by configuration
status: draft
profiles: [strict-general]
applies_to: [agent-settings, managed-settings, extension-package]
check_type: static
severity: medium
description: >-
  The actions that need human approval are enumerated in the agent's
  permission configuration as ask or deny rules, enforced by the host.
  They are not left to instructions the model may or may not follow, and
  no extension code in the repository handles the host's tool-approval
  event, where it could approve an action before the user is asked.
rationale: >-
  Designers and operators, not the agent, decide which actions need human
  sign-off. An instruction such as "ask before deleting" is a request to a
  model that injected content can override; a permission rule is enforced
  by the host. Extension code that answers the approval event moves that
  decision into code that is rarely reviewed as policy and, depending on
  the host's configuration, can approve calls other rules would stop.
audit:
  - id: approval-rules-present
    method: structure
    procedure: >-
      Every agent settings file in the repository defines at least one ask
      or deny rule. Not applicable when the repository contains no agent
      settings file.
  - id: approval-not-delegated
    method: pattern
    procedure: >-
      No in-process module in any extension package registers a handler
      for an event the client defines as a tool-approval event.
remediation: >-
  Write the approval requirements as ask and deny rules in the committed
  settings, or in managed policy. Remove approval handling from extension
  code; an extension that must refuse calls can do so from a guard event
  that cannot approve.
exceptions: permitted
references:
  owasp_asi: [ASI02, ASI09]
  five_eyes_risk_areas: [design-and-configuration, accountability]
  nist_csf: [PR.AA-05, GV.RR-02]
  other:
    - https://www.ncsc.govt.nz/assets/guidance/Documents/Careful-adoption-of-agentic-AI-services_FINAL.pdf
