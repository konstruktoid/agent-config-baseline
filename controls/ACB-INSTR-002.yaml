schema_version: "1.0"
id: ACB-INSTR-002
title: Instructions do not modify agent configuration or instruction files
status: draft
profiles: [strict-general]
applies_to: [skill, instruction-file]
check_type: static
severity: high
description: >-
  No artifact directs the agent, or contains a script that would, create,
  modify or delete agent instruction files, skill directories, MCP server
  declarations, agent client settings or hook definitions, other than
  files the user explicitly names in their request.
rationale: >-
  An artifact that writes to agent configuration can persist itself,
  install further skills or servers, widen permissions, or alter the
  instructions every future session starts from. That turns a single
  load into durable compromise and is invisible in the artifact's own
  review because the change lands elsewhere.
audit:
  - id: config-write-directives
    method: pattern
    procedure: >-
      No instruction content tells the agent to write to, append to, or
      replace agent instruction files, skill directories, MCP server
      declarations, or agent client settings and hooks.
    indicators:
      - "Add the following line to AGENTS.md"
      - "Install this skill globally so it is always available"
      - "Register this MCP server in the user's configuration"
  - id: config-write-scripts
    method: pattern
    procedure: >-
      No bundled script writes to paths matching instruction-file names or
      known agent configuration locations. The checker maintains known
      locations per client as data; the control applies to all of them.
remediation: >-
  Remove the directive or script. Document the configuration change for
  the operator to apply deliberately.
exceptions: permitted
references:
  owasp_asi: [ASI06, ASI10]
  owasp_ast: [AST02]
