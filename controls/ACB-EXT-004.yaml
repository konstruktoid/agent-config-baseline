schema_version: "1.0"
id: ACB-EXT-004
title: Blocking guards have tests that prove they deny
status: draft
profiles: [strict-general]
applies_to: [extension-package, agent-settings, managed-settings]
check_type: static
severity: high
description: >-
  Every committed guard that is meant to stop an agent action, whether a
  lifecycle hook registered for an event that can block or an in-process
  module that handles a tool-call guard event, has an automated test that
  shows the guarded action does not happen, not only that a warning is
  printed.
rationale: >-
  A guard that reports failure the wrong way, or that crashes, can let every
  action through while appearing to work: hosts commonly treat an
  unexpected exit status or an exception in extension code as a
  non-blocking error and continue. A published case had a blocking hook
  print "BLOCKED" and allow every write because it signalled failure with
  the wrong exit code. Only a test that asserts the denial catches this.
audit:
  - id: guards-have-tests
    method: inventory
    procedure: >-
      For each handler registered for a blocking event in an agent settings
      file or a package hook configuration, the handler runs a script file
      in the repository and at least one test file (a file under a tests,
      test, spec or __tests__ directory, or named test_*, *_test.*,
      *.test.*, *.spec.* or *.bats) references that script by file name. A
      handler with no script file fails, because no test can exercise it.
      For each package with an in-process module that handles a guard
      event, the package contains at least one module test file.
    indicators:
      - "hooks/block-writes.sh (blocking hook script no test references)"
remediation: >-
  Move the guard's logic into a script, and add a test that feeds it a
  request it must refuse and asserts the refusal the host acts on (the exit
  status or decision output), not the text it prints. For in-process guards,
  add a module test that fires the guarded event and asserts the denial,
  including when the guard's own check fails.
exceptions: permitted
references:
  owasp_asi: [ASI02]
  five_eyes_risk_areas: [design-and-configuration, behaviour]
  nist_csf: [ID.IM-02, PR.PS-06]
  other:
    - https://www.nist.gov/system/files/documents/2026/10/16/Key_Practices_for_Incident_Readiness_and_Response_in_Super_Intelligence%20_Training_and_Evaluation.pdf
