schema_version: "1.0"
id: ACB-EXT-003
title: Extension capabilities are recorded and high-risk ones are justified
status: draft
profiles: [strict-general]
applies_to: [extension-package]
check_type: static
severity: medium
description: >-
  A package that ships in-process modules commits a capability record,
  extension-capabilities.txt at the package root, listing the events each
  module handles and the host API calls it makes in the form the client's
  validator prints. Every high-risk capability the modules use (approving
  tool calls, rewriting prompts or tool calls, starting processes, making
  network requests, calling a model, reading secrets) is named and
  justified in the package README.
rationale: >-
  What in-process code can do is decided by the events it handles and the
  host calls it makes, not by its description. A committed record turns a
  new capability into a line in a diff that a reviewer sees, instead of a
  change buried in module source. Capabilities that let extension code
  approve actions, rewrite what the model reads or reach outside the host
  are the ones that defeat other controls, so each needs a stated reason.
audit:
  - id: record-present
    method: inventory
    procedure: >-
      If the package ships in-process modules, extension-capabilities.txt
      exists at the package root, is readable text, and names every module
      by file name.
  - id: high-risk-documented
    method: pattern
    procedure: >-
      Every event a module registers a handler for and every host API call
      it makes, as found in module source, that the client lists as high
      risk appears in the package README.
  - id: record-current
    method: structure
    procedure: >-
      When the operator enables validators and the client defines one, the
      validator's event and call lines for the package equal the lines in
      extension-capabilities.txt. Without an enabled, installed validator,
      this procedure is not evaluated rather than passed.
remediation: >-
  Generate the record with the client's validator, commit it at the package
  root, and regenerate it in CI so a stale record fails review. Justify each
  high-risk capability in the README, or remove it.
exceptions: permitted
references:
  owasp_asi: [ASI02, ASI04]
  owasp_ast: [AST02]
  five_eyes_risk_areas: [privilege, accountability]
  nist_csf: [ID.AM-02, ID.RA-09]
  other:
    - https://www.ncsc.govt.nz/assets/guidance/Documents/Careful-adoption-of-agentic-AI-services_FINAL.pdf
