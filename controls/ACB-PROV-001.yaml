schema_version: "1.0"
id: ACB-PROV-001
title: Skills and extension packages carry a provenance record
status: draft
profiles: [strict-general]
applies_to: [skill, extension-package]
check_type: static
severity: medium
description: >-
  Every skill and extension package has an entry in the repository's
  provenance record naming its source repository, the full commit hash it
  was taken from and a SHA-256 content digest.
rationale: >-
  Pins and digests elsewhere in this baseline say that something is fixed,
  not where it came from. Without a record of source and commit, a reviewer
  cannot tell whether a skill is the artifact its publisher released or a
  modified copy. The record is evidence the repository ships about itself,
  so this control establishes that the evidence exists and is well formed;
  it does not show that the digest matches the content or that anyone signed
  it.
audit:
  - id: record-present
    method: inventory
    procedure: >-
      The scanned root contains `.acb-provenance.yaml`, and its `artifacts`
      list has an entry whose `path` names the directory of every
      discovered skill and extension package, relative to the scanned root
      with `/` separators. A missing file fails once for every skill and
      extension package; a missing entry fails for that artifact.
  - id: record-fields
    method: structure
    procedure: >-
      `.acb-provenance.yaml` parses as a YAML mapping with an `artifacts`
      list. Each entry has a `path` that is unique in the list, a `source`
      that is an `https://` URL, a `commit` that is a full 40 or 64
      character lowercase hexadecimal hash, and a `digest` of the form
      `sha256:` followed by 64 lowercase hexadecimal characters.
    indicators:
      - "commit: main"
      - "commit: 1a2b3c4"
      - "digest: md5:0123456789abcdef0123456789abcdef"
      - "source: git@github.com:example/skills.git"
remediation: >-
  Add `.acb-provenance.yaml` at the repository root with one `artifacts`
  entry per skill or extension package: `path`, `source`, `commit` and
  `digest`. Record the commit the content was taken from, not a branch or
  tag name.
exceptions: permitted
references:
  owasp_asi: [ASI04]
  owasp_ast: [AST02]
  five_eyes_risk_areas: [design-and-configuration]
  nist_csf: [ID.RA-09]
  other:
    - https://slsa.dev/
    - https://github.com/konstruktoid/agent-config-baseline/blob/main/docs/provenance-design.md
