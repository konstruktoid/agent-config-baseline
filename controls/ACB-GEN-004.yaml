schema_version: "1.0"
id: ACB-GEN-004
title: Artifacts contain no invisible or bidirectional control characters
status: draft
profiles: [strict-general]
applies_to: [skill, instruction-file, mcp-server-declaration]
check_type: static
severity: high
description: >-
  No artifact contains Unicode characters that are invisible or that
  reorder displayed text, so that what a human reviewer sees is what the
  model reads.
rationale: >-
  Models read code points, reviewers read rendered glyphs. Zero-width
  characters, Unicode tag characters and bidirectional overrides let an
  author hide instructions that render as nothing, or as something else,
  in diffs, editors and registry pages. This is a cheap, reliable way to
  get unreviewed instructions into model context.
audit:
  - id: forbidden-code-points
    method: pattern
    procedure: >-
      No file contains any of: U+200B-U+200F, U+202A-U+202E, U+2060-U+2064,
      U+2066-U+2069, U+FEFF (except as the first code point of a file),
      U+00AD, U+180E, U+034F, U+061C, U+3164, U+2800, U+FFF9,
      U+FE00-U+FE0F (variation selectors), U+E0100-U+E01EF (supplementary
      variation selectors), any code point in U+E0000-U+E007F (tag
      characters), or any code point in Unicode private use areas.
  - id: confusable-identifiers
    method: pattern
    procedure: >-
      Skill names, file names and command names in code blocks contain only
      ASCII, so mixed-script look-alikes cannot impersonate a trusted name.
remediation: >-
  Strip the characters, review the decoded content to determine what was
  hidden, and treat the artifact as potentially malicious until the origin
  of the characters is explained.
exceptions: not-permitted
references:
  owasp_asi: [ASI01]
  five_eyes_risk_areas: [behaviour, accountability]
  nist_csf: [ID.RA-09]
  other:
    - https://www.unicode.org/reports/tr36/
    - https://trojansource.codes/
