schema_version: "1.0"
id: ACB-SKILL-001
title: SKILL.md frontmatter conforms to the Agent Skills specification
status: draft
profiles: [strict-general]
applies_to: [skill]
check_type: static
severity: high
description: >-
  Every skill directory contains a SKILL.md whose YAML frontmatter is
  parseable and satisfies the field constraints of the Agent Skills
  specification. Unknown top-level keys are not permitted; client-specific
  data belongs under `metadata`.
rationale: >-
  The name and description are the only content an agent reads before
  deciding to load a skill, so they are the skill's attack surface at
  discovery time. Malformed or non-conforming frontmatter is parsed
  differently by different clients, which makes behaviour unpredictable and
  lets metadata smuggle content that one client renders and another ignores.
  Strict conformance makes the same skill mean the same thing everywhere.
audit:
  - id: frontmatter-parses
    method: structure
    procedure: >-
      SKILL.md begins with a YAML frontmatter block delimited by `---` lines
      that parses as a mapping using a safe YAML loader (no tags, no anchors
      resolving to non-scalar types, no duplicate keys).
  - id: required-fields
    method: structure
    procedure: >-
      `name` is 1-64 characters, matches ^[a-z0-9]+(-[a-z0-9]+)*$ (no leading,
      trailing or consecutive hyphens), and equals the parent directory name.
      `description` is a non-empty string of at most 1024 characters.
  - id: optional-fields
    method: structure
    procedure: >-
      If present: `license` is a string; `compatibility` is 1-500 characters;
      `metadata` is a mapping of string keys to string values; `allowed-tools`
      is a string. No other top-level keys exist.
remediation: >-
  Correct the frontmatter to match the specification. Rename the skill
  directory or the `name` field so they match. Move any non-standard
  top-level keys under `metadata` as string values.
exceptions: not-permitted
references:
  owasp_asi: [ASI04]
  five_eyes_risk_areas: [design-and-configuration]
  nist_csf: [PR.PS-01]
  specifications:
    - https://agentskills.io/specification
