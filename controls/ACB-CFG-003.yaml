schema_version: "1.0"
id: ACB-CFG-003
title: Blocking policy is enforced in a layer user-installed extensions cannot override
status: draft
profiles: [strict-general]
applies_to: [managed-settings]
check_type: static
severity: high
description: >-
  Where the agent host supports organization-managed policy, the managed
  layer restricts in-process extension loading to organization-managed
  extensions and does not let any other extension approve an action a deny
  rule refuses. A repository that cannot carry managed policy is not the
  subject of this control: audit the deployed managed settings instead by
  running the checker on the directory that holds them.
rationale: >-
  Deny rules, ask rules and blocking hooks are only as strong as the layer
  that evaluates them. In-process extension code that can approve a tool
  call can make a rule the user set, or a hook the user installed, ineffective.
  Policy that must hold has to live where user-installed extension code
  cannot reach it, and the decision about which actions need human
  sign-off belongs to the system's designers and operators, not to the
  agent or to code it loads.
audit:
  - id: managed-extension-restriction
    method: structure
    procedure: >-
      Every managed settings file holds the client's extension restriction
      values: in-process extension code limited to managed extensions, no
      option that lets other extensions approve calls a deny rule refuses,
      and the host's own policy guard kept in any explicit load order.
remediation: >-
  Set the extension restriction values in managed policy and deploy them
  through the organization's settings management, then confirm on an
  endpoint that a user-installed extension is refused.
exceptions: permitted
references:
  owasp_asi: [ASI03, ASI04]
  five_eyes_risk_areas: [design-and-configuration, structural]
  nist_csf: [PR.PS-01, PR.PS-05]
  other:
    - https://www.ncsc.govt.nz/assets/guidance/Documents/Careful-adoption-of-agentic-AI-services_FINAL.pdf
